<text x="78" y="757" fill="#3E7C59" font-size="12" text-anchor="start" font-weight="bold">ANNUAL SERVICING LOOP  -  administered by INSITE (levy calculation, roll submission, collections reconciliation, investor reporting)</text>
<rect x="90" y="775" width="320" height="150" rx="6" fill="white" stroke="#153A5B" stroke-width="2"/>
<text x="106" y="801" fill="#153A5B" font-size="15" font-weight="bold">CAPITAL PARTNER</text>
<text x="106" y="829" fill="#374151" font-size="12.5">Bank / family office</text>
<text x="106" y="847" fill="#374151" font-size="12.5">Purchases privately placed,</text>
<text x="106" y="865" fill="#374151" font-size="12.5">tax-secured notes</text>
<text x="106" y="883" fill="#374151" font-size="12.5">(pilot: relationship-led)</text>
<rect x="612" y="788" width="276" height="120" rx="6" fill="white" stroke="#153A5B" stroke-width="2"/>
<text x="628" y="814" fill="#153A5B" font-size="15" font-weight="bold">PROPERTY OWNERS</text>
<text x="628" y="842" fill="#374151" font-size="12.5">Pay the annual special tax</text>
<text x="628" y="860" fill="#374151" font-size="12.5">over the note term</text>
<rect x="1090" y="775" width="330" height="150" rx="6" fill="white" stroke="#153A5B" stroke-width="2"/>
<text x="1106" y="801" fill="#153A5B" font-size="15" font-weight="bold">COUNTY TAX ROLL</text>
<text x="1106" y="829" fill="#374151" font-size="12.5">Special tax billed and collected</text>
<text x="1106" y="847" fill="#374151" font-size="12.5">with the property tax bill</text>
<text x="1106" y="865" fill="#374151" font-size="12.5">Lien on land; foreclosure remedy</text>
<text x="1106" y="883" fill="#374151" font-size="12.5">backstops payment</text>
