<text x="576" y="446" fill="white" font-size="15" font-weight="bold">INSITE&#8482;</text>
<text x="576" y="463" fill="white" font-size="11.5">Program Administrator &#183; HGF Management Company</text>
<text x="576" y="491" fill="#dfe9f3" font-size="12.5">Intake + completeness review</text>
<text x="576" y="509" fill="#dfe9f3" font-size="12.5">Underwriting (4:1 program policy)</text>
<text x="576" y="527" fill="#dfe9f3" font-size="12.5">Appraisal management</text>
<text x="576" y="545" fill="#dfe9f3" font-size="12.5">Standard documents + annexation pkg</text>
<text x="576" y="563" fill="#dfe9f3" font-size="12.5">Funding coordination</text>
<text x="576" y="581" fill="#dfe9f3" font-size="12.5">Annual administration + reporting</text>
<rect x="1120" y="430" width="320" height="215" rx="6" fill="white" stroke="#153A5B" stroke-width="2"/>
<text x="1136" y="456" fill="#153A5B" font-size="15" font-weight="bold">PUBLIC ISSUER</text>
<text x="1136" y="484" fill="#374151" font-size="12.5">City / County / JPA</text>
<text x="1136" y="502" fill="#374151" font-size="12.5">Owns the Master CFD under the</text>
<text x="1136" y="520" fill="#374151" font-size="12.5">Mello-Roos Act (Gov. Code 53311+)</text>
<text x="1136" y="538" fill="#374151" font-size="12.5">Approves each project annexation;</text>
<text x="1136" y="556" fill="#374151" font-size="12.5">authorizes the special tax and</text>
<text x="1136" y="574" fill="#374151" font-size="12.5">tax-secured notes</text>
