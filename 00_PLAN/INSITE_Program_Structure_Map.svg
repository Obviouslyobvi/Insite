<text x="106" y="146" fill="#153A5B" font-size="15" font-weight="bold">MAI APPRAISER NETWORK</text>
<text x="106" y="174" fill="#374151" font-size="12.5">Preferred providers under the</text>
<text x="106" y="192" fill="#374151" font-size="12.5">INS-102 RFQP; reports follow</text>
<text x="106" y="210" fill="#374151" font-size="12.5">INS-101 standards (CDIAC-consistent)</text>
<text x="106" y="228" fill="#374151" font-size="12.5">As-is value + bulk sale DCF</text>
<text x="106" y="246" fill="#374151" font-size="12.5">Supports the value-to-lien test</text>
<rect x="1080" y="120" width="330" height="175" rx="6" fill="white" stroke="#153A5B" stroke-width="2"/>
<text x="1096" y="146" fill="#153A5B" font-size="15" font-weight="bold">SPECIALTY CONSULTANTS</text>
<text x="1096" y="174" fill="#374151" font-size="12.5">Bond counsel: opinions + documents</text>
<text x="1096" y="192" fill="#374151" font-size="12.5">RMA / special tax consultant:</text>
<text x="1096" y="210" fill="#374151" font-size="12.5">levy formula design (one-time)</text>
<text x="1096" y="228" fill="#374151" font-size="12.5">Tax roll administrator: annual levy</text>
<text x="1096" y="246" fill="#374151" font-size="12.5">files, delinquency tracking</text>
<rect x="70" y="455" width="310" height="185" rx="6" fill="white" stroke="#153A5B" stroke-width="2"/>
<text x="86" y="481" fill="#153A5B" font-size="15" font-weight="bold">DEVELOPER</text>
<text x="86" y="509" fill="#374151" font-size="12.5">Small residential projects, 2-50 lots</text>
<text x="86" y="527" fill="#374151" font-size="12.5">Obligation: impact + permit fees due</text>
<text x="86" y="545" fill="#374151" font-size="12.5">before building permits issue</text>
<text x="86" y="563" fill="#374151" font-size="12.5">Submits Developer Data Package</text>
<text x="86" y="581" fill="#374151" font-size="12.5">(INS-201) + annexation consent</text>
