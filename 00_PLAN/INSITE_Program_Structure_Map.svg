<text x="40" y="42" fill="white" font-size="24" font-weight="bold" letter-spacing="1.5">INSITE&#8482; PROGRAM STRUCTURE MAP</text>
<text x="40" y="66" fill="#cfe0ee" font-size="13">How a small-subdivision fee financing moves from application to the annual tax roll&#160;&#160;|&#160;&#160;HGF Management Company&#160;&#160;|&#160;&#160;July 2026</text>
