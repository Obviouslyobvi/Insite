<text x="748" y="924.5" fill="white" font-size="13" font-weight="bold" text-anchor="middle">8</text>
<text x="500" y="906" fill="#6B7280" font-size="11.5" text-anchor="middle">Debt service flows to the note holder</text>
<text x="40" y="987" fill="#153A5B" font-size="14.5" text-anchor="start" font-weight="bold">THE MASTER CFD + ANNEXATION MODEL</text>
<text x="40" y="1010" fill="#374151" font-size="12">One CFD is formed per participating jurisdiction. Each new project annexes administratively into the existing district, so formation cost is</text>
<text x="40" y="1027" fill="#374151" font-size="12">paid once and per-project execution stays lean (founder-estimated $5K-$30K per annexation, pending real quotes).</text>
