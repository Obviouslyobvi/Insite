<text x="1253" y="1032" fill="#6B7280" font-size="10.5" text-anchor="middle">projects annex in over time</text>
<text x="40" y="1062" fill="#6B7280" font-size="10">Authority: Mello-Roos Community Facilities Act, Gov. Code sec. 53311 et seq. Value-to-lien: 3:1 statutory condition (sec. 53345.8); 4:1 is INSITE program policy (CSCDA precedent). Pre-launch concept. Not an offer of financing, legal, or investment advice. Structure subject to issuer approval and counsel review.</text>
