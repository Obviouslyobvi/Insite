name: Publish themed site to gh-pages

# Keeps the gh-pages branch in sync with 05_WEBSITE/theme_insite_ca/, the
# insite-ca.org-themed copy of the site. GitHub Pages serves that branch.
#
# This pushes to a branch rather than using actions/deploy-pages because the
# repository's Pages source is "Deploy from a branch". deploy-pages only works
# when the source is "GitHub Actions", and would fail on every run here.
#
# Only the themed website folder is published. The rest of the program package
# (evidence register, red-team memo, build log, quarantine) is never uploaded.

on:
  push:
    branches: [master]
    paths:
      - "05_WEBSITE/theme_insite_ca/**"
      - ".github/workflows/pages-theme-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stage the site
        # Copy the themed folder only, minus the QC screenshots and the build
        # notes, which are internal and add ~12 MB to the branch.
        run: |
          mkdir -p _site
          cp -r 05_WEBSITE/theme_insite_ca/. _site/
          rm -rf _site/qc _site/README.md
          touch _site/.nojekyll
          echo "Publishing $(find _site -type f | wc -l) files:"
          find _site -type f | sort

      - name: Push to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish themed site from ${GITHUB_SHA:0:7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published to gh-pages. Live at https://obviouslyobvi.github.io/Insite/"
