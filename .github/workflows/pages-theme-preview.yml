name: Publish themed site to GitHub Pages

# Publishes ONLY 05_WEBSITE/theme_insite_ca/ — the insite-ca.org-themed copy of
# the site. Nothing else in the repository is uploaded, so the program package
# (evidence register, red-team memo, build log, quarantine) is never served.

on:
  push:
    branches: [master]
    paths:
      - "05_WEBSITE/theme_insite_ca/**"
      - ".github/workflows/pages-theme-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stage the site
        # Copy the themed folder only, minus the QC screenshots and the build
        # notes, which are internal and add ~12 MB to the upload.
        run: |
          mkdir -p _site
          cp -r 05_WEBSITE/theme_insite_ca/. _site/
          rm -rf _site/qc _site/README.md
          touch _site/.nojekyll
          echo "Publishing $(find _site -type f | wc -l) files:"
          find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
